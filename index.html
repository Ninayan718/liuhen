<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>留痕 · 第 n 版的自己</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="留痕">
<meta name="theme-color" content="#FCF9F4">
<meta name="description" content="用行为痕迹不断校正自我叙事。纯本地、零订阅、不打卡。">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<style>:root{
  --bg:#FCF9F4;
  --card:#FFFFFF;
  --line:#E7E1D6;
  --line-soft:#F0EBE1;
  --ink:#2E2A24;
  --ink-2:#6E675B;
  --ink-3:#A39C8E;
  --accent:#35526B;
  --accent-soft:#E8EEF3;
  --again-bg:#E8F0EC; --again-ink:#3B6B55;
  --meh-bg:#F1EEE7;   --meh-ink:#7A7367;
  --done-bg:#F6EAE4;  --done-ink:#9A5A3E;
  --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px;
  line-height:1.6;
  min-height:100vh;
  padding-bottom:calc(78px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
button,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.top{
  padding:calc(18px + env(safe-area-inset-top)) 20px 12px;
  border-bottom:1px solid var(--line-soft);
  background:var(--bg);
}
.top-row{display:flex;align-items:center;justify-content:space-between}
.brand{font-size:21px;font-weight:600;letter-spacing:.14em}
.brand-mark{display:flex;align-items:center;gap:4px;height:18px}
.brand-mark i{display:block;height:3px;border-radius:2px;background:var(--accent);opacity:.75}
.brand-mark i:nth-child(1){width:20px}
.brand-mark i:nth-child(2){width:14px}
.brand-mark i:nth-child(3){width:9px}
.brand-mark b{display:block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:2px}
.tagline{font-size:12px;color:var(--ink-3);letter-spacing:.06em;margin-top:2px}
main{padding:16px 16px 24px;max-width:560px;margin:0 auto}
.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  display:flex;background:rgba(255,255,255,.96);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
  backdrop-filter:saturate(160%) blur(8px);
}
.tabs button{
  flex:1;min-width:0;height:60px;position:relative;
  font-size:12px;color:var(--ink-3);letter-spacing:.04em;
  display:flex;align-items:center;justify-content:center;
}
.tabs button::before{
  content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:0;height:2px;background:var(--accent);transition:width .18s ease;
}
.tabs button.on{color:var(--accent);font-weight:600}
.tabs button.on::before{width:26px}
.h1{font-size:17px;font-weight:600;line-height:1.45;margin:0 0 4px}
.lead{font-size:13px;color:var(--ink-2);margin:0 0 16px;line-height:1.65;text-wrap:pretty}
.hint{font-size:12px;color:var(--ink-3);line-height:1.6}
.card{
  background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);padding:16px;margin-bottom:14px;
}
.card.tight{padding:14px}
.card.flat{background:transparent;border-style:dashed}
.sec-label{
  font-size:11px;color:var(--ink-3);letter-spacing:.12em;
  margin:0 0 10px;text-transform:none;
}
.sec-label + .h1{margin-top:0}
.divider{height:1px;background:var(--line-soft);margin:14px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  min-height:44px;padding:0 16px;border-radius:22px;
  border:1px solid var(--line);background:var(--card);
  font-size:14px;color:var(--ink-2);
  display:inline-flex;align-items:center;justify-content:center;
}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
.taste{display:grid;gap:9px;margin-top:4px}
.taste button{
  min-height:52px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);display:flex;align-items:center;
  padding:0 14px;font-size:14px;text-align:left;gap:10px;
}
.taste button .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.taste button.t-again .dot{background:var(--again-ink)}
.taste button.t-meh .dot{background:var(--meh-ink)}
.taste button.t-done .dot{background:var(--done-ink)}
.taste button .sub{margin-left:auto;font-size:12px;color:var(--ink-3)}
.taste button.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.taste button.on.t-again{background:var(--again-bg)}
.taste button.on.t-meh{background:var(--meh-bg)}
.taste button.on.t-done{background:var(--done-bg)}
.saved{
  border:1px solid #CFE0D5;background:#F2F8F4;border-radius:12px;
  padding:14px;margin-bottom:14px;
}
.saved .title{font-size:14px;color:var(--again-ink);font-weight:600;margin-bottom:8px}
.note-row{display:flex;gap:8px;align-items:flex-end;margin-top:10px}
textarea{
  width:100%;min-width:0;min-height:52px;resize:vertical;
  border:1px solid var(--line);border-radius:10px;
  padding:11px 12px;background:var(--card);font-size:14px;line-height:1.55;
  outline:none;
}
textarea:focus{border-color:var(--accent)}
.btn{
  min-height:44px;padding:0 16px;border-radius:10px;
  background:var(--accent);color:#fff;font-size:14px;font-weight:500;
  display:inline-flex;align-items:center;justify-content:center;
  white-space:nowrap;
}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.plain{background:var(--accent-soft);color:var(--accent);font-weight:500}
.btn.danger{background:transparent;color:#9A5A3E;border:1px solid #E4CFC3}
.btn.block{width:100%}
.btn:disabled{opacity:.4}
.btn-row{display:flex;gap:9px;flex-wrap:wrap;margin-top:10px}
.btn-row .btn{flex:1;min-width:110px}
.list{margin:0;padding:0;list-style:none}
.item{
  display:flex;align-items:flex-start;gap:10px;
  padding:11px 0;border-bottom:1px solid var(--line-soft);
}
.item:last-child{border-bottom:0;padding-bottom:0}
.item:first-child{padding-top:2px}
.item .body{flex:1;min-width:0}
.item .line1{font-size:14px;line-height:1.5;word-break:break-word}
.item .line2{font-size:12px;color:var(--ink-3);margin-top:2px}
.item .x{
  flex:0 0 auto;width:28px;height:28px;border-radius:8px;
  color:var(--ink-3);font-size:16px;line-height:1;
  display:flex;align-items:center;justify-content:center;
}
.tag{
  display:inline-block;font-size:11px;padding:2px 8px;border-radius:6px;
  vertical-align:middle;margin-right:6px;
}
.tag.again{background:var(--again-bg);color:var(--again-ink)}
.tag.meh{background:var(--meh-bg);color:var(--meh-ink)}
.tag.done{background:var(--done-bg);color:var(--done-ink)}
.tag.ctx{background:var(--accent-soft);color:var(--accent)}
.metric{display:flex;gap:10px;margin-bottom:14px}
.metric .m{
  flex:1;min-width:0;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:12px 10px;text-align:center;
}
.metric .m .n{font-size:22px;font-weight:600;line-height:1.2;color:var(--accent)}
.metric .m .l{font-size:11px;color:var(--ink-3);margin-top:4px}
.bar-row{margin-bottom:11px}
.bar-row:last-child{margin-bottom:0}
.bar-head{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.bar-head .k{color:var(--ink-2)}
.bar-head .v{color:var(--ink-3);font-size:12px}
.bar-track{height:8px;border-radius:5px;background:var(--line-soft);overflow:hidden}
.bar-fill{height:100%;border-radius:5px;background:var(--accent);opacity:.8}
.bar-fill.again{background:var(--again-ink)}
.bar-fill.meh{background:var(--meh-ink)}
.bar-fill.done{background:var(--done-ink)}
.bar-fill.zero{background:transparent}
.callout{
  background:var(--accent-soft);border-radius:10px;
  padding:12px 13px;font-size:13px;color:var(--accent);line-height:1.65;
}
.callout.warn{background:#FAF0EA;color:#8A5338}
.empty{
  text-align:center;padding:22px 12px;color:var(--ink-3);
  font-size:13px;line-height:1.7;
}
.qtext{font-size:16px;font-weight:500;line-height:1.6;margin-bottom:14px}
.qopts{display:grid;gap:9px}
.qopts button{
  min-height:50px;border:1px solid var(--line);border-radius:11px;
  background:var(--card);text-align:left;padding:0 14px;font-size:14px;
}
.qopts button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.qmeta{font-size:12px;color:var(--ink-3);margin-top:12px}
.compare{display:grid;gap:10px}
.compare .side{
  border:1px solid var(--line);border-radius:11px;padding:13px;
  background:var(--card);
}
.compare .side .lab{font-size:11px;color:var(--ink-3);letter-spacing:.1em;margin-bottom:7px}
.compare .side .val{font-size:14px;line-height:1.65;word-break:break-word}
.history{
  border-left:2px solid var(--line);padding-left:14px;margin-left:4px;
}
.history .h{position:relative;padding:0 0 15px}
.history .h:last-child{padding-bottom:0}
.history .h::before{
  content:"";position:absolute;left:-19px;top:7px;width:8px;height:8px;
  border-radius:50%;background:var(--accent);opacity:.65;
}
.history .h .d{font-size:11px;color:var(--ink-3)}
.history .h .t{font-size:14px;line-height:1.6;margin-top:2px;word-break:break-word}
.foot{font-size:12px;color:var(--ink-3);line-height:1.75;margin:18px 2px 4px}
.foot strong{color:var(--ink-2);font-weight:500}
#toast{
  position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom));
  transform:translate(-50%,10px);z-index:40;
  background:#2E2A24;color:#fff;font-size:13px;
  padding:10px 18px;border-radius:20px;max-width:86%;text-align:center;
  opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;
}
#toast.show{opacity:1;transform:translate(-50%,0)}
.hidden{display:none !important}
input[type=file]{display:none}
</style>
</head>
<body>
<header class="top">
  <div class="top-row">
    <div class="brand">留痕</div>
    <div class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><b></b></div>
  </div>
  <div class="tagline" id="tagline">用痕迹校正叙事</div>
</header>
<main id="view" role="main"></main>
<nav class="tabs" id="tabs" aria-label="页签">
  <button type="button" data-tab="log"><span>记</span></button>
  <button type="button" data-tab="ask"><span>一问</span></button>
  <button type="button" data-tab="week"><span>回看</span></button>
  <button type="button" data-tab="month"><span>校正</span></button>
  <button type="button" data-tab="me"><span>我的</span></button>
</nav>
<div id="toast" role="status" aria-live="polite"></div>
<script>window.LH = {
  CTX: [
    { id: 'work',  name: '工作' },
    { id: 'people',name: '人' },
    { id: 'alone', name: '独处' },
    { id: 'body',  name: '身体' },
    { id: 'money', name: '钱' }
  ],
  TASTE: [
    { id: 'again', name: '想再来', sub: '做完还想再有一次', cls: 'again' },
    { id: 'meh',   name: '无所谓', sub: '没什么特别感觉', cls: 'meh' },
    { id: 'done',  name: '只想结束', sub: '做完只想交差', cls: 'done' }
  ],
  SLOTS: [
    { id: 'morning', name: '早晨', from: 5,  to: 10 },
    { id: 'day',     name: '白天', from: 11, to: 16 },
    { id: 'evening', name: '傍晚', from: 17, to: 21 },
    { id: 'night',   name: '夜里', from: 22, to: 4 }
  ],
  QUESTIONS: [
    { id: 'q01', text: '今天有没有一件事，不用逼自己就开始了？', opts: ['有', '没有', '没留意'] },
    { id: 'q02', text: '今天什么时候你明显收紧了？', opts: ['跟人说话时', '事情被打断时', '几乎没有'] },
    { id: 'q03', text: '花的钱和时间，和你说自己在乎的一致吗？', opts: ['大致一致', '不太一致', '没想过'] },
    { id: 'q04', text: '有没有一个反应，强度明显超过事情本身？', opts: ['有', '没有', '说不清'] },
    { id: 'q05', text: '有没有哪件事，没人看见你也做了？', opts: ['有', '没有', '没留意'] },
    { id: 'q06', text: '今天最想回避的是哪一类？', opts: ['人', '某件事', '没有'] },
    { id: 'q07', text: '今天你更像在往前走，还是在撑着？', opts: ['往前走', '撑着', '都有'] },
    { id: 'q08', text: '今天有没有一件事，你连犹豫都没有就拒绝了？', opts: ['有', '没有', '没留意'] },
    { id: 'q09', text: '如果今天只留一件事，它更接近哪一类？', opts: ['做完的', '没做完的', '说不出口的'] },
    { id: 'q10', text: '最近一次觉得「这很像我」，是跟谁在一起时？', opts: ['一个人', '熟的人', '不太熟的人'] }
  ],
  ABOUT: [
    '了解自己不能只靠想。内省会不断改写记忆，真正可靠的是留下的行为痕迹。',
    '这里不问「我是谁」，只问可判定的小事：什么条件下会主动、做完还想不想再来、什么时候会收紧。',
    '看模式不看事件，跨情境重复出现才算倾向；和你以为的不一样的那条，信息量往往最大。',
    '工具不替你下判断，也不给你打分。它只把你说过的和做过的摆在一起。'
  ]
};
</script>
<script>(function () {
  'use strict';

  var L = window.LH;
  var KEY = 'liuhen.v1';
  var TABS = ['log', 'ask', 'week', 'month', 'me'];
  var TAGLINES = {
    log: '用痕迹校正叙事',
    ask: '问得小一点，才答得出来',
    week: '看模式，也看反例',
    month: '说过的，和做过的',
    me: '关于这个工具'
  };

  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function dateStr(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function monthStr(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1); }
  function dateTime(ts) {
    var d = new Date(ts);
    return pad(d.getMonth() + 1) + '/' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function nameOf(list, id) {
    for (var i = 0; i < list.length; i++) { if (list[i].id === id) return list[i].name; }
    return '未分类';
  }
  function clsOf(id) {
    for (var i = 0; i < L.TASTE.length; i++) { if (L.TASTE[i].id === id) return L.TASTE[i].cls; }
    return 'meh';
  }
  function weekStart(d) {
    var x = new Date(d.getTime());
    x.setHours(0, 0, 0, 0);
    x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
    return x;
  }
  function dayHash(s) {
    var h = 0;
    for (var i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) >>> 0; }
    return h;
  }
  function slotOf(h) {
    if (h >= 5 && h <= 10) return 'morning';
    if (h >= 11 && h <= 16) return 'day';
    if (h >= 17 && h <= 21) return 'evening';
    return 'night';
  }
  function uniqId(p) {
    return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function blank() {
    return { version: 1, entries: [], answers: [], conclusions: [], qOffset: {}, external_words: [] };
  }
  function normalize(o) {
    var b = blank();
    if (!o || typeof o !== 'object') return b;
    b.entries = Array.isArray(o.entries) ? o.entries.filter(function (e) { return e && e.id && e.ts; }) : [];
    b.entries.forEach(function (e) {
      e.note = e.note || '';
      e.ctx = e.ctx || 'alone';
      e.after = e.after || 'meh';
      e.date = e.date || dateStr(new Date(e.ts));
      e.hour = typeof e.hour === 'number' ? e.hour : new Date(e.ts).getHours();
      if (!Array.isArray(e.external_words)) e.external_words = [];
    });
    b.answers = Array.isArray(o.answers) ? o.answers.filter(function (a) { return a && a.id; }) : [];
    b.conclusions = Array.isArray(o.conclusions) ? o.conclusions.filter(function (c) { return c && c.id; }) : [];
    b.qOffset = (o.qOffset && typeof o.qOffset === 'object') ? o.qOffset : {};
    b.external_words = Array.isArray(o.external_words) ? o.external_words : [];
    return b;
  }
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      return raw ? normalize(JSON.parse(raw)) : blank();
    } catch (e) { return blank(); }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(data)); return true; }
    catch (e) { toast('没能保存，设备存储可能已满'); return false; }
  }

  var data = load();
  var curTab = 'log';
  var draft = { ctx: null, after: null };
  var justSaved = null;
  var noteBuffer = '';
  var conclusionBuffer = '';
  var clearArmed = false;
  var toastTimer = null;

  function toast(msg) {
    var t = document.getElementById('toast');
    if (!t) return;
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 1900);
  }
  function sortedEntries() {
    return data.entries.slice().sort(function (a, b) { return b.ts - a.ts; });
  }
  function findEntry(id) {
    for (var i = 0; i < data.entries.length; i++) { if (data.entries[i].id === id) return data.entries[i]; }
    return null;
  }
  function countBy(list, key) {
    var m = {};
    list.forEach(function (e) { m[e[key]] = (m[e[key]] || 0) + 1; });
    return m;
  }
  function bar(label, val, max, cls) {
    var pct = max > 0 ? Math.round(val / max * 100) : 0;
    return '<div class="bar-row"><div class="bar-head"><span class="k">' + esc(label) +
      '</span><span class="v">' + val + ' 条</span></div><div class="bar-track"><div class="bar-fill ' +
      (pct === 0 ? 'zero' : (cls || '')) + '" style="width:' + pct + '%"></div></div></div>';
  }
  function entryLine(e, withDel) {
    var t = nameOf(L.TASTE, e.after);
    var c = nameOf(L.CTX, e.ctx);
    var body = e.note ? esc(e.note) : '没补那句话';
    return '<li class="item"><div class="body"><div class="line1"><span class="tag ' +
      clsOf(e.after) + '">' + esc(t) + '</span><span class="tag ctx">' + esc(c) + '</span>' + body +
      '</div><div class="line2">' + dateTime(e.ts) + '</div></div>' +
      (withDel ? '<button class="x" type="button" data-act="del-entry" data-id="' + esc(e.id) +
        '" aria-label="删掉这一条">×</button>' : '') + '</li>';
  }
  function emptyBox(text) { return '<div class="empty">' + esc(text) + '</div>'; }
  function card(title, inner) {
    return '<div class="card"><div class="sec-label">' + esc(title) + '</div>' + inner + '</div>';
  }
  function metric(items) {
    return '<div class="metric">' + items.map(function (i) {
      return '<div class="m"><div class="n">' + esc(i.n) + '</div><div class="l">' + esc(i.l) + '</div></div>';
    }).join('') + '</div>';
  }

  function renderLog() {
    var chips = L.CTX.map(function (c) {
      return '<button type="button" class="chip' + (draft.ctx === c.id ? ' on' : '') +
        '" data-act="draft-ctx" data-id="' + c.id + '">' + esc(c.name) + '</button>';
    }).join('');
    var tastes = L.TASTE.map(function (t) {
      return '<button type="button" class="t-' + t.cls + (draft.after === t.id ? ' on' : '') +
        '" data-act="draft-after" data-id="' + t.id + '"><span class="dot"></span>' + esc(t.name) +
        '<span class="sub">' + esc(t.sub) + '</span></button>';
    }).join('');

    var saved = '';
    if (justSaved) {
      var e = findEntry(justSaved);
      if (e) {
        saved = '<div class="saved"><div class="title">记下了 · ' + esc(nameOf(L.CTX, e.ctx)) +
          ' / ' + esc(nameOf(L.TASTE, e.after)) + '</div>' +
          '<div class="hint">要不要补一句刚才发生了什么？不补也完整。</div>' +
          '<div class="note-row"><textarea id="noteInput" rows="2" maxlength="200" placeholder="刚才发生了什么……">' +
          esc(noteBuffer) + '</textarea><button class="btn ghost" type="button" data-act="note-save">补上</button></div>' +
          '<div class="btn-row"><button class="btn plain" type="button" data-act="new-entry">再来一条</button></div></div>';
      }
    }

    var recent = sortedEntries().slice(0, 5);
    var list = recent.length
      ? '<ul class="list">' + recent.map(function (x) { return entryLine(x, true); }).join('') + '</ul>'
      : emptyBox('还没有留痕。等电梯时点两下就好。');

    return '<h1 class="h1">刚才那件事，点两下就好</h1>' +
      '<p class="lead">先选场景，再选余味。想补一句再补，不补也算记下了。</p>' +
      '<div class="card"><div class="sec-label">1 / 场景</div><div class="chips">' + chips + '</div>' +
      '<div class="divider"></div><div class="sec-label">2 / 做完的余味</div>' +
      '<div class="taste">' + tastes + '</div></div>' + saved +
      card('最近留痕', list) +
      '<p class="foot">断了也没关系，记一条就算。<br>不打卡、不评分、也不显示连续天数。</p>';
  }

  function todayQuestion(today, off) {
    return L.QUESTIONS[(dayHash(today) + off * 3) % L.QUESTIONS.length];
  }
  function renderAsk() {
    var today = dateStr(new Date());
    var off = data.qOffset[today] || 0;
    var q = todayQuestion(today, off);
    var answered = null;
    data.answers.forEach(function (a) { if (a.date === today && a.qid === q.id) answered = a; });

    var opts = q.opts.map(function (o) {
      return '<button type="button" class="' + (answered && answered.choice === o ? 'on' : '') +
        '" data-act="answer" data-qid="' + q.id + '" data-choice="' + esc(o) + '">' + esc(o) + '</button>';
    }).join('');

    var ws = weekStart(new Date());
    var weekAnswers = data.answers.filter(function (a) {
      return new Date(a.date + 'T00:00:00') >= ws;
    }).slice().sort(function (a, b) { return b.ts - a.ts; }).slice(0, 6);
    var aList = weekAnswers.length
      ? '<ul class="list">' + weekAnswers.map(function (a) {
          var qq = null;
          L.QUESTIONS.forEach(function (x) { if (x.id === a.qid) qq = x; });
          return '<li class="item"><div class="body"><div class="line1">' +
            esc(qq ? qq.text : a.qid) + '</div><div class="line2">' + esc(a.date) + ' · ' +
            esc(a.choice) + '</div></div></li>';
        }).join('') + '</ul>'
      : emptyBox('这周还没有答过。答不答都行，问题会一直在这儿。');

    return '<h1 class="h1">今天只问一个小的</h1>' +
      '<p class="lead">大问题只会得到标签。这里问的都是能当场判定的小事。</p>' +
      '<div class="card"><div class="sec-label">今日一问 · ' + esc(today) + '</div>' +
      '<div class="qtext">' + esc(q.text) + '</div><div class="qopts">' + opts + '</div>' +
      '<div class="qmeta">' + (answered ? '今天这一题记下了，随时可以改。' : '答不答都行，不催。') +
      ' <button type="button" data-act="next-q" style="color:var(--accent);text-decoration:underline">换一题</button></div></div>' +
      card('这周答过的', aList) +
      '<p class="foot">题目每天固定一条，不会因为刷新就变。换一题只在今天有效。</p>';
  }

  function renderWeek() {
    var ws = weekStart(new Date());
    var list = data.entries.filter(function (e) { return new Date(e.ts) >= ws; });
    var total = list.length;
    var days = {};
    list.forEach(function (e) { days[e.date] = 1; });
    var dayCount = Object.keys(days).length;
    var weekAnswers = data.answers.filter(function (a) { return new Date(a.date + 'T00:00:00') >= ws; }).length;

    if (total === 0) {
      return '<h1 class="h1">这一周的回看</h1>' +
        '<p class="lead">回看才是产生认识的那一步。记录只是把原料留下来。</p>' +
        metric([{ n: 0, l: '条痕迹' }, { n: 0, l: '天有痕迹' }, { n: weekAnswers, l: '题答过' }]) +
        '<div class="card">' + emptyBox('这周还没有痕迹。等电梯时点两下就好，不用补记，也不用从头开始。') + '</div>' +
        '<p class="foot">不显示连续天数，也不提醒你断了几天。</p>';
    }

    var ctxCount = countBy(list, 'ctx');
    var afterCount = countBy(list, 'after');
    var ctxMax = Math.max.apply(null, L.CTX.map(function (c) { return ctxCount[c.id] || 0; }).concat([1]));
    var afterMax = Math.max.apply(null, L.TASTE.map(function (t) { return afterCount[t.id] || 0; }).concat([1]));
    var ctxBars = L.CTX.map(function (c) { return bar(c.name, ctxCount[c.id] || 0, ctxMax); }).join('');
    var afterBars = L.TASTE.map(function (t) {
      return bar(t.name, afterCount[t.id] || 0, afterMax, t.cls);
    }).join('');

    var top = L.CTX.map(function (c) { return { name: c.name, n: ctxCount[c.id] || 0 }; })
      .filter(function (x) { return x.n > 0; })
      .sort(function (a, b) { return b.n - a.n; }).slice(0, 3);
    var topHtml = '<ul class="list">' + top.map(function (x, i) {
      return '<li class="item"><div class="body"><div class="line1">' + (i + 1) + '. ' +
        esc(x.name) + '</div><div class="line2">出现 ' + x.n + ' 次</div></div></li>';
    }).join('') + '</ul>';

    var mainAfter = L.TASTE.slice().sort(function (a, b) {
      return (afterCount[b.id] || 0) - (afterCount[a.id] || 0);
    })[0].id;
    var outliers = list.filter(function (e) { return e.after !== mainAfter; })
      .sort(function (a, b) { return b.ts - a.ts; }).slice(0, 2);
    var outlierHtml = '';
    if (total >= 3 && outliers.length) {
      outlierHtml = '<div class="callout">这几条和你这周的大多数不太一样，值得单独看一眼：<br>' +
        outliers.map(function (e) {
          return '· ' + esc(e.note || (nameOf(L.CTX, e.ctx) + ' / ' + nameOf(L.TASTE, e.after))) +
            '（' + dateTime(e.ts) + '）';
        }).join('<br>') + '</div>';
    }

    var slotCount = {};
    list.forEach(function (e) { var s = slotOf(e.hour); slotCount[s] = (slotCount[s] || 0) + 1; });
    var slotMax = Math.max.apply(null, L.SLOTS.map(function (s) { return slotCount[s.id] || 0; }).concat([1]));
    var slotBars = L.SLOTS.map(function (s) { return bar(s.name, slotCount[s.id] || 0, slotMax); }).join('');
    var missing = L.SLOTS.filter(function (s) { return !slotCount[s.id]; }).map(function (s) { return s.name; });
    var biasHtml = missing.length
      ? '<div class="callout warn">这周几乎没在「' + esc(missing.join('、')) +
        '」留下记录。只在某几个时段记，会看不到其它时段的自己。</div>'
      : '';

    var againList = list.filter(function (e) { return e.after === 'again'; })
      .sort(function (a, b) { return b.ts - a.ts; }).slice(0, 5);
    var againHtml = againList.length
      ? '<ul class="list">' + againList.map(function (e) { return entryLine(e, false); }).join('') + '</ul>'
      : emptyBox('这周还没有「想再来」的事。');

    return '<h1 class="h1">这一周的回看</h1>' +
      '<p class="lead">看模式不看事件。重复出现才算倾向，反例信息量最大。</p>' +
      metric([{ n: total, l: '条痕迹' }, { n: dayCount, l: '天有痕迹' }, { n: weekAnswers, l: '题答过' }]) +
      card('反复出现的情境', topHtml) +
      card('做完的余味', afterBars) +
      card('场景分布', ctxBars) +
      card('想再来的事', againHtml) +
      (outlierHtml ? card('不太一样的那几条', outlierHtml) : '') +
      card('都记在哪些时段', slotBars + (biasHtml ? '<div style="margin-top:12px">' + biasHtml + '</div>' : '')) +
      '<p class="foot">这里只做呈现，不替你下结论。</p>';
  }

  function renderMonth() {
    var mkey = monthStr(new Date());
    var list = data.entries.filter(function (e) { return (e.date || '').slice(0, 7) === mkey; });
    var total = list.length;
    var ctxCount = countBy(list, 'ctx');
    var topCtx = L.CTX.slice().sort(function (a, b) {
      return (ctxCount[b.id] || 0) - (ctxCount[a.id] || 0);
    })[0];
    var again = list.filter(function (e) { return e.after === 'again'; }).length;
    var done = list.filter(function (e) { return e.after === 'done'; }).length;
    var last = data.conclusions.length ? data.conclusions[data.conclusions.length - 1] : null;

    var doneText = total
      ? '本月留下 ' + total + ' 条痕迹，最常出现在「' + esc(nameOf(L.CTX, topCtx.id)) +
        '」，其中「想再来」' + again + ' 次、「只想结束」' + done + ' 次。'
      : '本月还没有痕迹可对照。';
    var saidText = last ? esc(last.text) : '还没有写下过一句对自己的描述。';

    var history = data.conclusions.length
      ? '<div class="history">' + data.conclusions.slice().reverse().map(function (c) {
          return '<div class="h"><div class="d">' + esc(c.month) + ' · ' + dateTime(c.ts) +
            '</div><div class="t">' + esc(c.text) + '</div></div>';
        }).join('') + '</div>'
      : emptyBox('写下第一句之后，这里会留下每一版。不覆盖旧版本。');

    return '<h1 class="h1">这个月的校正</h1>' +
      '<p class="lead">工具不替你下判断。这里只把你说过的和做过的摆在一起，由你自己改那句话。</p>' +
      metric([{ n: total, l: '本月痕迹' }, { n: again, l: '想再来' }, { n: data.conclusions.length, l: '版描述' }]) +
      '<div class="compare"><div class="side"><div class="lab">你说过的</div><div class="val">' +
      saidText + '</div></div><div class="side"><div class="lab">你做过的</div><div class="val">' +
      doneText + '</div></div></div>' +
      '<p class="hint" style="margin:10px 2px 16px">看看这两边对不对得上。对不上也没关系，那正是要看的地方。</p>' +
      '<div class="card"><div class="sec-label">现在，我会这样描述自己</div>' +
      '<textarea id="conclusionInput" rows="3" maxlength="300" placeholder="不用准确，写此刻这一版就好……">' +
      esc(conclusionBuffer) + '</textarea>' +
      '<div class="btn-row"><button class="btn" type="button" data-act="save-conclusion">存下这一版</button></div></div>' +
      card('历次写下的自己', history) +
      '<p class="foot">旧版本不会被覆盖。过几个月回头看，变化本身也是数据。</p>';
  }

  function renderMe() {
    var about = '<ul class="list">' + L.ABOUT.map(function (t) {
      return '<li class="item"><div class="body"><div class="line1">' + esc(t) + '</div></div></li>';
    }).join('') + '</ul>';
    var clearBtn = clearArmed
      ? '<button class="btn danger" type="button" data-act="clear-confirm">再点一次，确认清空</button>'
      : '<button class="btn danger" type="button" data-act="clear-arm">清空全部数据</button>';

    return '<h1 class="h1">关于这个工具</h1>' +
      '<p class="lead">一个用来持续了解自己的地方。零订阅、不联网、不打卡。</p>' +
      card('它是怎么想的', about) +
      '<div class="callout" style="margin-bottom:14px">所有数据只存在这台设备的浏览器里，不会上传到任何服务器。换设备请用下面的导出／导入。</div>' +
      metric([{ n: data.entries.length, l: '条痕迹' }, { n: data.answers.length, l: '个回答' },
        { n: data.conclusions.length, l: '版描述' }]) +
      '<div class="card"><div class="sec-label">备份与迁移</div>' +
      '<div class="btn-row"><button class="btn plain" type="button" data-act="export">导出 JSON</button>' +
      '<button class="btn ghost" type="button" data-act="import">导入并合并</button></div>' +
      '<p class="hint" style="margin-top:10px">导入会按记录编号去重合并，不会覆盖已有内容。建议偶尔导出一份留着。</p>' +
      '<input type="file" id="importFile" accept="application/json,.json"></div>' +
      '<div class="card"><div class="sec-label">重来一次</div>' + clearBtn +
      '<p class="hint" style="margin-top:10px">清空不可撤销。清空前可以先导出一份。</p></div>' +
      '<p class="foot"><strong>留痕 v1</strong> · 单文件、离线可用。<br>' +
      '加到手机主屏幕后，等电梯时点两下就好。</p>';
  }

  function renderAll() {
    var views = { log: renderLog, ask: renderAsk, week: renderWeek, month: renderMonth, me: renderMe };
    var view = document.getElementById('view');
    view.innerHTML = views[curTab]();
    var tag = document.getElementById('tagline');
    if (tag) tag.textContent = TAGLINES[curTab];
    var btns = document.querySelectorAll('#tabs button');
    for (var i = 0; i < btns.length; i++) {
      btns[i].classList.toggle('on', btns[i].getAttribute('data-tab') === curTab);
    }
  }
  function go(tab) {
    if (TABS.indexOf(tab) < 0) return;
    curTab = tab;
    noteBuffer = '';
    conclusionBuffer = '';
    clearArmed = false;
    try { history.replaceState(null, '', '#' + tab); } catch (e) { /* file:// 下忽略 */ }
    renderAll();
    window.scrollTo(0, 0);
  }
  function tabFromHash() {
    var h = (location.hash || '').replace('#', '');
    return TABS.indexOf(h) >= 0 ? h : 'log';
  }

  function commitEntry() {
    var now = new Date();
    var e = {
      id: uniqId('e_'), ts: now.getTime(), date: dateStr(now), hour: now.getHours(),
      ctx: draft.ctx, after: draft.after, note: '', external_words: []
    };
    data.entries.push(e);
    save();
    draft = { ctx: null, after: null };
    justSaved = e.id;
    noteBuffer = '';
    renderAll();
    toast('记下了');
  }
  function upsertAnswer(qid, choice) {
    var today = dateStr(new Date());
    var found = null;
    data.answers.forEach(function (a) { if (a.date === today && a.qid === qid) found = a; });
    if (found) { found.choice = choice; found.ts = Date.now(); }
    else data.answers.push({ id: uniqId('a_'), date: today, qid: qid, choice: choice, ts: Date.now() });
    save();
    renderAll();
    toast('记下了');
  }
  function doExport() {
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'liuhen-' + dateStr(new Date()) + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 500);
    toast('已导出');
  }
  function mergeArr(target, incoming) {
    var seen = {}, added = 0;
    target.forEach(function (x) { seen[x.id] = 1; });
    (incoming || []).forEach(function (x) {
      if (x && x.id && !seen[x.id]) { target.push(x); seen[x.id] = 1; added++; }
    });
    return added;
  }
  function doImport(text) {
    var incoming;
    try { incoming = JSON.parse(text); } catch (e) { toast('这个文件读不出来'); return; }
    if (!incoming || !Array.isArray(incoming.entries)) { toast('不像是留痕的备份文件'); return; }
    var n = mergeArr(data.entries, incoming.entries) +
      mergeArr(data.answers, incoming.answers) +
      mergeArr(data.conclusions, incoming.conclusions);
    data = normalize(data);
    data.entries.sort(function (a, b) { return a.ts - b.ts; });
    save();
    renderAll();
    toast(n ? '合并了 ' + n + ' 条新内容' : '没有新内容');
  }

  document.addEventListener('click', function (ev) {
    var tabBtn = ev.target.closest('#tabs button');
    if (tabBtn) { go(tabBtn.getAttribute('data-tab')); return; }
    var el = ev.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act');
    var id = el.getAttribute('data-id');

    if (act === 'draft-ctx') {
      draft.ctx = id;
      if (draft.ctx && draft.after) commitEntry(); else renderAll();
    } else if (act === 'draft-after') {
      draft.after = id;
      if (draft.ctx && draft.after) commitEntry(); else renderAll();
    } else if (act === 'note-save') {
      var e = findEntry(justSaved);
      if (e) { e.note = noteBuffer.trim(); save(); toast('补上了'); renderAll(); }
    } else if (act === 'new-entry') {
      justSaved = null; noteBuffer = ''; renderAll();
    } else if (act === 'del-entry') {
      if (window.confirm('删掉这一条？')) {
        data.entries = data.entries.filter(function (x) { return x.id !== id; });
        if (justSaved === id) justSaved = null;
        save(); renderAll();
      }
    } else if (act === 'answer') {
      upsertAnswer(el.getAttribute('data-qid'), el.getAttribute('data-choice'));
    } else if (act === 'next-q') {
      var today = dateStr(new Date());
      data.qOffset[today] = (data.qOffset[today] || 0) + 1;
      save(); renderAll();
    } else if (act === 'save-conclusion') {
      var text = conclusionBuffer.trim();
      if (!text) { toast('先写一句再存'); return; }
      data.conclusions.push({ id: uniqId('c_'), month: monthStr(new Date()), text: text, ts: Date.now() });
      conclusionBuffer = '';
      save(); renderAll(); toast('存下这一版了');
    } else if (act === 'export') {
      doExport();
    } else if (act === 'import') {
      var inp = document.getElementById('importFile');
      if (inp) inp.click();
    } else if (act === 'clear-arm') {
      clearArmed = true; renderAll();
    } else if (act === 'clear-confirm') {
      data = blank(); draft = { ctx: null, after: null }; justSaved = null;
      noteBuffer = ''; conclusionBuffer = ''; clearArmed = false;
      save(); renderAll(); toast('已清空');
    }
  });

  document.addEventListener('input', function (ev) {
    if (ev.target.id === 'noteInput') noteBuffer = ev.target.value;
    if (ev.target.id === 'conclusionInput') conclusionBuffer = ev.target.value;
  });
  document.addEventListener('change', function (ev) {
    if (ev.target.id !== 'importFile') return;
    var f = ev.target.files && ev.target.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () { doImport(String(r.result)); };
    r.onerror = function () { toast('文件读不出来'); };
    r.readAsText(f);
    ev.target.value = '';
  });
  window.addEventListener('hashchange', function () {
    var t = tabFromHash();
    if (t !== curTab) { curTab = t; renderAll(); }
  });

  curTab = tabFromHash();
  renderAll();
})();
</script>
</body>
</html>
